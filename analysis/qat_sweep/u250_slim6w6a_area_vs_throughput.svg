   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="45.36" y="428.544" transform="rotate(-0 45.36 428.544)">From 108 to 3,810 FPS (35×), LUTs grow 1.77× and DSPs 45×: most logic and memory is a fixed cost.</text>
  </g>
  <g id="text_25">
   <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="45.36" y="444.672" transform="rotate(-0 45.36 444.672)">Targets 100–2,000 FPS were met; the 5,000 FPS target reached 3,810 FPS. BRAM counts 18K blocks as half a 36K block.</text>
  </g>
 </g>
